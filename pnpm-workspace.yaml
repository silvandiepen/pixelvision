packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"
allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  # Dependencies of @angular/build's cache. Their install scripts only compile from
  # source when no prebuilt binary fits; the binaries ship as optional packages.
  lmdb: false
  msgpackr-extract: false
  # Its postinstall only downloads optional CUDA binaries; CPU binaries ship in the package.
  onnxruntime-node: false
  # Dependency of onnxruntime-web; its install script isn't needed at runtime.
  protobufjs: false
